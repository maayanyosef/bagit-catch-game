<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/x-icon" href="assets/apple-touch-icon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <title>Bagit Catch Game</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XHEC3V0NPY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-XHEC3V0NPY');
  </script>
</head>
<body class="start">
  <div id="gameControls">
    <input type="text" id="nicknameInput" placeholder="Enter your nickname">
    <button id="startButton">Start Game</button>
  </div>

  <div id="leaderboard"></div>
  <button id="stopButton">Stop Game</button>
  <div id="scoreboard">
    Time: <span id="time">60</span> sec | Score: <span id="score">0</span> | Stars: <span id="stars">0</span>
  </div>
  <img id="starImage" src="assets/github-stars.png" alt="Star Earned">
  <canvas id="gameCanvas"></canvas>

  <!-- Mobile touch controls -->
  <div id="mobileControls">
    <button id="leftButton" class="controlButton">←</button>
    <button id="jumpButton" class="controlButton">↑</button>
    <button id="rightButton" class="controlButton">→</button>
  </div>

  <audio id="catchSound" src="assets/sound.mp3"></audio>
  <script src="game.js"></script>
</body>
</html>
