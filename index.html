<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/x-icon" href="https://bagit.explorium.ninja/apple-touch-icon.png">
  <link rel="apple-touch-icon" href="https://bagit.explorium.ninja/apple-touch-icon.png">
  <title>Bagit Catch Game</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XHEC3V0NPY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-XHEC3V0NPY');
  </script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      overflow: hidden;
      background: #FFFFFF;
      font-family: Arial, sans-serif;
      touch-action: manipulation;
      position: fixed;
      width: 100%;
      height: 100%;
    }
    body.start {
      background: url('https://bagit.explorium.ninja/background.png') no-repeat center center fixed;
      background-size: contain;
      background-position: center;
      background-color: black;
      background-repeat: no-repeat;
    }
    @media (max-width: 768px) {
      body.start {
        background-size: cover;
      }
    }
    canvas {
      display: block;
      touch-action: none;
    }
    #scoreboard {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 18px;
      color: black;
      display: none;
      background-color: rgba(255, 255, 255, 0.7);
      padding: 5px;
      border-radius: 5px;
      z-index: 100;
    }
    @media (max-width: 480px) {
      #scoreboard {
        font-size: 14px;
        top: 5px;
        right: 5px;
        padding: 3px;
      }
    }
    #gameControls {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
    }
    #nicknameInput {
      width: 100%;
      max-width: 300px;
      font-size: 18px;
      padding: 15px;
      border: 2px solid #FF5722;
      border-radius: 10px;
      margin-bottom: 20px;
      margin-top: 50px;
    }
    @media (max-width: 480px) {
      #nicknameInput {
        font-size: 16px;
        padding: 10px;
        margin-top: 30px;
      }
    }
    #startButton {
      width: 100%;
      max-width: 300px;
      padding: 15px;
      font-size: 18px;
      cursor: pointer;
      background-color: #FF5722;
      color: white;
      border: none;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    @media (max-width: 480px) {
      #startButton {
        font-size: 16px;
        padding: 10px;
      }
    }
    #stopButton {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 10px 15px;
      font-size: 16px;
      cursor: pointer;
      background-color: #FF5722;
      color: white;
      border: none;
      border-radius: 5px;
      display: none;
      z-index: 100;
    }
    @media (max-width: 480px) {
      #stopButton {
        font-size: 14px;
        padding: 5px 10px;
      }
    }
    #starImage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 150px;
      display: none;
      z-index: 10;
      animation: rotateStar 1s linear;
    }
    @media (max-width: 480px) {
      #starImage {
        width: 100px;
      }
    }
    .baguette {
      position: absolute;
      width: 50px;
      height: 100px;
      pointer-events: none;
    }
    @media (max-width: 480px) {
      .baguette {
        width: 30px;
        height: 60px;
      }
    }
    #leaderboard {
      width: 90%;
      max-width: 500px;
      margin: 20px auto;
      padding: 15px;
      border-radius: 10px;
      background-color: white;
      z-index: 100;
      display: none;
      overflow-x: auto;
    }
    @media (max-width: 480px) {
      #leaderboard {
        padding: 10px;
        font-size: 14px;
      }
      #leaderboard h2 {
        font-size: 18px;
      }
      #leaderboard th,
      #leaderboard td {
        padding: 5px !important;
      }
    }
    /* Mobile touch controls */
    #mobileControls {
      position: absolute;
      bottom: 40px;
      width: 100%;
      display: none;
      justify-content: space-around;
      z-index: 100;
      touch-action: manipulation;
    }
    .controlButton {
      width: 80px;
      height: 80px;
      background-color: rgba(255, 87, 34, 0.7);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: white;
      border: none;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    @media (max-width: 480px) {
      .controlButton {
        width: 70px;
        height: 70px;
        font-size: 24px;
      }
    }
    @keyframes rotateStar {
      0% {
        transform: translate(-50%, -50%) rotate(0deg);
      }
      100% {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }
    /* Responsive table styles for leaderboard */
    #leaderboard table {
      width: 100%;
      border-collapse: collapse;
    }
    #leaderboard th,
    #leaderboard td {
      padding: 8px;
      text-align: center;
      border: 1px solid #ddd;
    }
    #leaderboard tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    #orientationWarning {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      color: white;
      font-size: 24px;
      text-align: center;
      padding-top: 40%;
      z-index: 1000;
    }
    /* Removed rotate-device.png and its styling for the <img> */
  </style>
</head>
<body class="start">
  <div id="gameControls">
    <input type="text" id="nicknameInput" placeholder="Enter your nickname">
    <button id="startButton">Start Game</button>
  </div>

  <div id="leaderboard"></div>
  <button id="stopButton">Stop Game</button>
  <div id="scoreboard">
    Time: <span id="time">60</span> sec | Score: <span id="score">0</span> | Stars: <span id="stars">0</span>
  </div>
  <img id="starImage" src="https://bagit.explorium.ninja/github-stars.png" alt="Star Earned">
  <canvas id="gameCanvas"></canvas>

  <!-- Mobile touch controls -->
  <div id="mobileControls">
    <button id="leftButton" class="controlButton">←</button>
    <button id="jumpButton" class="controlButton">↑</button>
    <button id="rightButton" class="controlButton">→</button>
  </div>

  <!-- Orientation warning without the rotate-device.png image -->
  <div id="orientationWarning">
    <p>Please rotate your device to landscape mode for the best gaming experience!</p>
  </div>

  <audio id="catchSound" src="sound.mp3"></audio>

  <script>
    /**********************************************
     * 1) Declare Variables Before Using Them
     **********************************************/
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreboard = document.getElementById('scoreboard');
    const startButton = document.getElementById('startButton');
    const stopButton = document.getElementById('stopButton');
    const starImage = document.getElementById('starImage');
    const nicknameInput = document.getElementById('nicknameInput');
    const leaderboard = document.getElementById('leaderboard');
    const timeElement = document.getElementById('time');
    const scoreElement = document.getElementById('score');
    const starsElement = document.getElementById('stars');
    const catchSound = document.getElementById('catchSound');
    const body = document.body;
    const mobileControls = document.getElementById('mobileControls');
    const leftButton = document.getElementById('leftButton');
    const rightButton = document.getElementById('rightButton');
    const jumpButton = document.getElementById('jumpButton');
    const gameControls = document.getElementById('gameControls');
    const orientationWarning = document.getElementById('orientationWarning');

    // Detect mobile devices
    const isMobile =
      'ontouchstart' in window ||
      navigator.maxTouchPoints > 0 ||
      /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(
        navigator.userAgent
      );

    // Global game variables
    let score = 0;
    let stars = 0;
    let time = 60;
    let gameInterval;
    let baguettes = [];
    let endGameTriggered = false;

    // Cat object declared BEFORE usage in resizeCanvas
    let cat = {
      x: canvas.width / 2,
      y: canvas.height - 150,
      width: 120,
      height: 90,
      isJumping: false,
      jumpHeight: canvas.height / 4,
      initialY: canvas.height - 150,
      velocityY: 0,
      gravity: 1.5,
      speed: isMobile ? 8 : 10
    };

    // Adjust cat size for small screens
    if (window.innerWidth <= 480) {
      cat.width = 80;
      cat.height = 60;
    }

    /**********************************************
     * 2) Resize Canvas Function
     **********************************************/
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      // Adjust cat position
      cat.initialY = canvas.height - 150;
      if (!cat.isJumping) {
        cat.y = cat.initialY;
      }
      // Responsive cat sizing
      if (window.innerWidth <= 480) {
        cat.width = 80;
        cat.height = 60;
      } else {
        cat.width = 120;
        cat.height = 90;
      }

      // Show or hide orientation warning on mobile
      if (isMobile && window.innerHeight > window.innerWidth) {
        orientationWarning.style.display = 'block';
      } else {
        orientationWarning.style.display = 'none';
      }
    }

    // Call resizeCanvas immediately
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', resizeCanvas);

    const catImg = new Image();
    catImg.src = 'https://bagit.explorium.ninja/github.png';

    /**********************************************
     * 3) Helper for Both Touch & Click
     **********************************************/
    function addTouchEventHandler(element, callback) {
      element.addEventListener(
        'touchstart',
        function (e) {
          e.preventDefault();
          callback();
        },
        { passive: false }
      );
      element.addEventListener('click', callback);
    }

    // Attach event listeners to start and stop buttons
    addTouchEventHandler(startButton, startGame);
    addTouchEventHandler(stopButton, stopGame);

    // Jump on canvas click or touch
    canvas.addEventListener('click', jump);
    canvas.addEventListener(
      'touchstart',
      function (e) {
        e.preventDefault();
        jump();
      },
      { passive: false }
    );

    // Desktop controls
    document.addEventListener('keydown', function (event) {
      if (event.key === 'ArrowLeft') {
        moveLeft();
      } else if (event.key === 'ArrowRight') {
        moveRight();
      } else if (event.key === ' ' || event.key === 'ArrowUp') {
        jump();
      }
    });

    // Mouse move on desktop
    document.addEventListener('mousemove', function (event) {
      if (!isMobile) {
        cat.x = event.clientX - cat.width / 2;
        cat.x = Math.max(0, Math.min(cat.x, canvas.width - cat.width));
      }
    });

    // Touch move on non-mobile? (Unlikely, but kept for completeness)
    document.addEventListener(
      'touchmove',
      function (event) {
        if (!isMobile) {
          const touch = event.touches[0];
          cat.x = touch.clientX - cat.width / 2;
          cat.x = Math.max(0, Math.min(cat.x, canvas.width - cat.width));
          event.preventDefault();
        }
      },
      { passive: false }
    );

    // Mobile controls
    if (isMobile) {
      let leftInterval, rightInterval;
      jumpButton.addEventListener(
        'touchstart',
        function (e) {
          e.preventDefault();
          jump();
        },
        { passive: false }
      );
      leftButton.addEventListener(
        'touchstart',
        function (e) {
          e.preventDefault();
          clearInterval(leftInterval);
          leftInterval = setInterval(() => {
            moveLeft();
          }, 16);
        },
        { passive: false }
      );
      leftButton.addEventListener(
        'touchend',
        function (e) {
          e.preventDefault();
          clearInterval(leftInterval);
        },
        { passive: false }
      );
      rightButton.addEventListener(
        'touchstart',
        function (e) {
          e.preventDefault();
          clearInterval(rightInterval);
          rightInterval = setInterval(() => {
            moveRight();
          }, 16);
        },
        { passive: false }
      );
      rightButton.addEventListener(
        'touchend',
        function (e) {
          e.preventDefault();
          clearInterval(rightInterval);
        },
        { passive: false }
      );
      document.addEventListener('touchend', function () {
        clearInterval(leftInterval);
        clearInterval(rightInterval);
      });
    }

    /**********************************************
     * 4) Movement & Game Functions
     **********************************************/
    function moveLeft() {
      cat.x -= cat.speed;
      cat.x = Math.max(0, cat.x);
    }
    function moveRight() {
      cat.x += cat.speed;
      cat.x = Math.min(cat.x, canvas.width - cat.width);
    }
    function jump() {
      if (!cat.isJumping) {
        cat.isJumping = true;
        cat.velocityY = -cat.jumpHeight / 10;
      }
    }

    function updateCat() {
      if (cat.isJumping) {
        cat.y += cat.velocityY;
        cat.velocityY += cat.gravity;
        if (cat.y > cat.initialY) {
          cat.y = cat.initialY;
          cat.isJumping = false;
          cat.velocityY = 0;
        }
      }
    }

    /**********************************************
     * 5) Start & Stop Game
     **********************************************/
    function startGame() {
      console.log("Start game button clicked");
      orientationWarning.style.display = 'none';

      const nickname = nicknameInput.value.trim();
      if (!nickname) {
        alert('Please enter your nickname!');
        return;
      }

      // Set up game UI
      body.classList.remove('start');
      gameControls.style.display = 'none';
      leaderboard.style.display = 'none';
      stopButton.style.display = 'block';
      scoreboard.style.display = 'block';

      if (isMobile) {
        mobileControls.style.display = 'flex';
      }

      // Reset game variables
      score = 0;
      stars = 0;
      time = 60;
      timeElement.textContent = time;
      scoreElement.textContent = score;
      starsElement.textContent = stars;
      cat.y = cat.initialY;
      cat.isJumping = false;
      cat.velocityY = 0;
      endGameTriggered = false;

      // Start main game loop
      gameInterval = setInterval(updateGame, 1000 / 60);

      // Countdown timer
      const timerInterval = setInterval(() => {
        if (time > 0) {
          time--;
          timeElement.textContent = time;
        } else if (!endGameTriggered) {
          clearInterval(timerInterval);
          endGame(nickname);
        }
      }, 1000);
    }

    function stopGame() {
      clearInterval(gameInterval);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stopButton.style.display = 'none';
      scoreboard.style.display = 'none';
      mobileControls.style.display = 'none';
      score = 0;
      stars = 0;
      clearBaguettes();
      body.classList.add('start');
      gameControls.style.display = 'flex';
    }

    /**********************************************
     * 6) Game Loop: updateGame, collisions, etc.
     **********************************************/
    function updateGame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawSidewalk();
      updateCat();
      drawCat();
      updateBaguettes();
      checkCollisions();
      checkMissedBaguettes();
    }

    function drawCat() {
      ctx.drawImage(catImg, cat.x, cat.y, cat.width, cat.height);
    }

    function drawSidewalk() {
      ctx.fillStyle = '#a9a9a9';
      ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
    }

    function spawnBaguette() {
      const x = Math.random() * (canvas.width - 50);
      const speedX = (Math.random() - 0.5) * 4;
      const baguette = document.createElement('img');
      baguette.src =
        'https://emoji.slack-edge.com/T8UPK0YQ3/bagit/130f01dbd0e3f77d.gif';
      baguette.classList.add('baguette');
      baguette.style.left = `${x}px`;
      baguette.style.top = `0px`;

      const speedYBase = isMobile ? 1.5 : 2;
      const speedYAdjust = canvas.height > 800 ? 1.2 : 1;
      baguette.dataset.speedY = speedYBase * speedYAdjust;
      baguette.dataset.speedX = speedX;
      document.body.appendChild(baguette);
      baguettes.push(baguette);
    }

    function updateBaguettes() {
      // Increase spawn rate with score
      const spawnRate = Math.min(0.03, 0.01 + score / 500);
      if (Math.random() < spawnRate) spawnBaguette();

      baguettes.forEach((baguette) => {
        const speedY = parseFloat(baguette.dataset.speedY);
        const speedX = parseFloat(baguette.dataset.speedX);
        baguette.style.top = `${parseFloat(baguette.style.top) + speedY}px`;
        baguette.style.left = `${parseFloat(baguette.style.left) + speedX}px`;

        // Use computed width to handle collisions properly
        const baguetteWidth = parseFloat(
          getComputedStyle(baguette).width
        );
        if (
          parseFloat(baguette.style.left) < 0 ||
          parseFloat(baguette.style.left) >
            canvas.width - baguetteWidth
        ) {
          baguette.dataset.speedX = -speedX;
        }
      });
    }

    function checkCollisions() {
      baguettes.forEach((baguette, index) => {
        const baguetteRect = baguette.getBoundingClientRect();
        const catRect = {
          left: cat.x,
          top: cat.y,
          right: cat.x + cat.width,
          bottom: cat.y + cat.height
        };
        if (
          catRect.left < baguetteRect.right &&
          catRect.right > baguetteRect.left &&
          catRect.top < baguetteRect.bottom &&
          catRect.bottom > baguetteRect.top
        ) {
          document.body.removeChild(baguette);
          baguettes.splice(index, 1);
          score++;
          scoreElement.textContent = score;

          // Play catch sound
          try {
            const soundClone = catchSound.cloneNode();
            soundClone.volume = 0.3;
            soundClone.play().catch((e) =>
              console.log('Audio play prevented:', e)
            );
          } catch (err) {
            console.log('Error playing sound:', err);
          }

          // Star logic
          if (score % 10 === 0) {
            stars++;
            starsElement.textContent = stars;
            showStarImage();
          }
          if (score % 100 === 0) {
            stars += 2;
            starsElement.textContent = stars;
            showStarImage();
          }
        }
      });
    }

    function checkMissedBaguettes() {
      baguettes.forEach((baguette, index) => {
        if (parseFloat(baguette.style.top) > canvas.height - 30) {
          document.body.removeChild(baguette);
          baguettes.splice(index, 1);
          score--;
          score = Math.max(0, score);
          scoreElement.textContent = score;
        }
      });
    }

    function clearBaguettes() {
      baguettes.forEach((baguette) => {
        if (document.body.contains(baguette)) {
          document.body.removeChild(baguette);
        }
      });
      baguettes = [];
    }

    function showStarImage() {
      starImage.style.display = 'block';
      setTimeout(() => {
        starImage.style.display = 'none';
      }, 1000);
    }

    /**********************************************
     * 7) End Game & Leaderboard
     **********************************************/
    function endGame(nickname) {
      if (endGameTriggered) return;
      endGameTriggered = true;

      clearInterval(gameInterval);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stopButton.style.display = 'none';
      scoreboard.style.display = 'none';
      mobileControls.style.display = 'none';
      clearBaguettes();
      body.classList.add('start');
      gameControls.style.display = 'flex';

      const gameData = {
        event: 'Game Ended',
        details: {
          nickname: nickname,
          score: score,
          stars: stars,
          platform: isMobile ? 'mobile' : 'desktop'
        }
      };

      fetch(
        'https://script.google.com/macros/s/AKfycbw9dyf_wJn2KFMGSV8VeslPCZHUSLufYdhXM1bPKlhik7hcjgTicKykdLFsB9qTDsxmQw/exec',
        {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(gameData)
        }
      )
        .then(() => {
          showLeaderboard();
        })
        .catch((error) => {
          console.error('Error:', error);
          showLeaderboard();
        });
    }

    function showLeaderboard() {
      leaderboard.innerHTML =
        '<p style="text-align: center;">Loading leaderboard...</p>';
      leaderboard.style.display = 'block';
      fetch(
        'https://script.google.com/macros/s/AKfycbw9dyf_wJn2KFMGSV8VeslPCZHUSLufYdhXM1bPKlhik7hcjgTicKykdLFsB9qTDsxmQw/exec'
      )
        .then((response) => response.json())
        .then((data) => {
          let leaderboardHTML = `
            <h2 style="text-align: center; color: #FF5722; margin-bottom: 20px;">Leaderboard</h2>
            <table>
              <thead>
                <tr style="background-color: #FF5722; color: white;">
                  <th>Nickname</th>
                  <th>Score</th>
                  <th>Stars</th>
                  <th>Date</th>
                </tr>
              </thead>
              <tbody>
          `;
          data.forEach((row) => {
            const timestamp = row[3] ? row[3].split(' ')[0] : '';
            leaderboardHTML += `
              <tr>
                <td>${row[0]}</td>
                <td>${row[1]}</td>
                <td>${row[2]}</td>
                <td>${timestamp}</td>
              </tr>
            `;
          });
          leaderboardHTML += `
              </tbody>
            </table>`;
          leaderboard.innerHTML = leaderboardHTML;
        })
        .catch((error) => {
          console.error('Error fetching leaderboard:', error);
          leaderboard.innerHTML =
            '<p style="text-align: center; color: red;">Failed to load leaderboard. Please try again later.</p>';
        });
    }

    /**********************************************
     * 8) Audio Unlock for iOS
     **********************************************/
    function unlockAudio() {
      console.log("Unlocking audio context");
      try {
        const unlockAudio = document.createElement('audio');
        unlockAudio.setAttribute(
          'src',
          'data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4LjMyLjEwNAAAAAAAAAAAAAAA//tQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAABEgD///////////////////////////////////////////8AAAA8TEFNRTMuMTAwAwAAAAAAABEgJARgTQAB4AAAESJMYLQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'
        );
        unlockAudio.volume = 0.01;
        unlockAudio.play().catch((e) =>
          console.log('Audio play prevented:', e)
        );
        catchSound.volume = 0.01;
        catchSound
          .play()
          .then(() => {
            catchSound.pause();
            catchSound.currentTime = 0;
          })
          .catch((e) => console.log('Main audio unlock failed:', e));
      } catch (err) {
        console.error('Error initializing audio:', err);
      }
    }

    document.addEventListener('touchstart', unlockAudio, { once: true });
    document.addEventListener('click', unlockAudio, { once: true });
    document.addEventListener('keydown', unlockAudio, { once: true });

    /**********************************************
     * 9) Misc Touchmove Prevent Zoom
     **********************************************/
    document.addEventListener(
      'touchmove',
      function (event) {
        if (event.scale !== 1) {
          event.preventDefault();
        }
      },
      { passive: false }
    );

    /**********************************************
     * 10) Window Load & Visibility
     **********************************************/
    window.addEventListener('load', function () {
      console.log("Window loaded, initializing game environment");
      resizeCanvas();
      if (isMobile && window.innerHeight > window.innerWidth) {
        orientationWarning.style.display = 'block';
      }
    });

    document.addEventListener('visibilitychange', function () {
      if (document.hidden && gameInterval) {
        // Pause game
        clearInterval(gameInterval);
      } else if (
        !document.hidden &&
        time > 0 &&
        !gameControls.style.display.includes('flex')
      ) {
        // Resume game if not ended
        gameInterval = setInterval(updateGame, 1000 / 60);
      }
    });
  </script>
</body>
</html>
