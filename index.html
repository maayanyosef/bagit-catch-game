<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/x-icon" href="assets/apple-touch-icon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <title>Bagit Catch Game</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XHEC3V0NPY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-XHEC3V0NPY');
  </script>
</head>
<body class="start">
  <div id="gameControls">
    <input type="text" id="nicknameInput" placeholder="Enter your nickname">
    <div id="difficultySelector">
      <span id="difficultyLabel">Difficulty:</span>
      <button class="diffBtn active" data-diff="easy">🟢 Easy</button>
      <button class="diffBtn" data-diff="normal">🟡 Normal</button>
      <button class="diffBtn" data-diff="hard">🔴 Hard</button>
    </div>
    <div id="personalBest"></div>
    <button id="startButton">Start Game</button>
  </div>

  <div id="endScoreSummary" style="display:none;"></div>
  <div id="leaderboard"></div>
  <button id="stopButton">Stop Game</button>
  <button id="pauseButton" style="display:none;">⏸ Pause</button>
  <div id="scoreboard">
    Time: <span id="time">60</span>s | Score: <span id="score">0</span> | ⭐ <span id="stars">0</span>
  </div>
  <div id="comboDisplay"></div>
  <div id="powerupDisplay"></div>
  <img id="starImage" src="assets/github-stars.png" alt="Star Earned">
  <canvas id="gameCanvas"></canvas>

  <!-- Pause overlay -->
  <div id="pauseOverlay">
    <div id="pauseBox">
      <h2>⏸ Paused</h2>
      <p>Press P / ESC to resume</p>
      <button id="resumeButton">Resume</button>
    </div>
  </div>

  <!-- Mobile touch controls -->
  <div id="mobileControls">
    <button id="leftButton" class="controlButton">←</button>
    <button id="jumpButton" class="controlButton">↑</button>
    <button id="rightButton" class="controlButton">→</button>
  </div>

  <div id="orientationWarning" style="display: none;"></div>

  <audio id="catchSound" src="assets/sound.mp3"></audio>
  <script src="game.js"></script>
  <script>
    // Wire up resume button
    document.getElementById('resumeButton').addEventListener('click', function() {
      togglePause();
    });
  </script>
</body>
</html>
